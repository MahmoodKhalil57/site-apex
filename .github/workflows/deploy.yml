# Build the static frontend from the backend snapshot and publish to GitHub
# Pages. Triggered on push, on a content-publish dispatch from the backend, or
# manually. The Astro frontend is never hosted on Cloudflare — only the backend
# (admin + REST API + media) is.
name: Deploy static frontend

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Fetch content snapshot → local SQLite
        env:
          EMDASH_PREVIEW_SECRET: ${{ secrets.EMDASH_PREVIEW_SECRET }}
        run: node bin/snapshot-to-sqlite.mjs "${{ secrets.BACKEND_URL }}" ./snapshot.db
      - name: Build static site
        env:
          EMDASH_SNAPSHOT_DB: ./snapshot.db
          SITE_URL: ${{ secrets.SITE_URL }}
        run: bunx astro build
      - name: Apply seed to backend (idempotent)
        if: ${{ hashFiles('seed.json') != '' }}
        env:
          SEED_SECRET: ${{ secrets.SEED_SECRET }}
        run: node bin/apply-seed.mjs "${{ secrets.BACKEND_URL }}" ./seed.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
